name: Decompilation progress

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Select pinned ARM toolchain
        shell: bash
        run: |
          toolchain="$(nix build --no-link --print-out-paths .#toolchain)"
          binutils="$(nix build --no-link --print-out-paths .#binutils)"
          compiler="$toolchain/bin/arm-none-eabi-gcc"
          bin="$binutils/bin"
          test -x "$compiler" && test -x "$bin/arm-none-eabi-as"
          printf 'CROSS_COMPILE=%s\n' "${compiler%gcc}" >> "$GITHUB_ENV"
          printf 'ARM_AS=%s\n' "$bin/arm-none-eabi-as" >> "$GITHUB_ENV"
          printf 'ARM_OBJDUMP=%s\n' "$bin/arm-none-eabi-objdump" >> "$GITHUB_ENV"
          printf 'ARM_READELF=%s\n' "$bin/arm-none-eabi-readelf" >> "$GITHUB_ENV"
          printf 'ARM_LD=%s\n' "$bin/arm-none-eabi-ld" >> "$GITHUB_ENV"
          printf 'ARM_NONE_EABI_BIN=%s\n' "$bin" >> "$GITHUB_ENV"
          printf '%s\n' "$bin" "$(dirname "$compiler")" >> "$GITHUB_PATH"

      - name: Build clean-room base objects
        run: npm run base:build

      - name: Check repository boundary
        run: npm run check

      - name: Test CRO unit configuration
        run: |
          node --check scripts/validate-public-cro-metadata.mjs
          node --check scripts/test-public-cro-metadata.mjs
          node scripts/test-public-cro-metadata.mjs
          node scripts/validate-public-cro-metadata.mjs --require-complete
          node --check scripts/prepare-bytematch-report.mjs
          node --check scripts/test-prepare-bytematch-report.mjs
          node scripts/test-prepare-bytematch-report.mjs
          node --check scripts/generate-cro-symbols.mjs
          node --check scripts/generate-objdiff-config.mjs
          node --check scripts/split-cro-target-object.mjs
          node --check scripts/validate-cro-function-semantics.mjs
          node --check scripts/validate-split-cro-target-object.mjs
          node --check scripts/test-cro-function-semantics.mjs
          node --check scripts/test-generate-cro-symbols.mjs
          node --check scripts/test-generate-objdiff-config.mjs
          node scripts/test-cro-function-semantics.mjs
          node scripts/test-generate-cro-symbols.mjs
          node scripts/test-generate-objdiff-config.mjs
          node scripts/validate-split-cro-target-object.mjs --self-test

      - name: Prepare validated ByteMatch report
        run: npm run report

      - name: Upload ByteMatch report
        uses: actions/upload-artifact@v4
        with:
          name: AS_EUR_REV2_report
          path: build/AS_EUR_REV2/report.json
          if-no-files-found: error

