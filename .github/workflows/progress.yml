name: Decompilation progress

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull-request-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Require a scoped Conventional Commit title
        shell: bash
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)\([a-z0-9][a-z0-9._/-]*\)!?: .+'
          if ! grep -Eq "$pattern" <<< "$PR_TITLE"; then
            echo "Pull request title must use scoped Conventional Commit syntax."
            echo "Example: feat(cro): match DllExample leaf routines"
            exit 1
          fi

  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-main-

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Select pinned ARM toolchain
        shell: bash
        run: |
          toolchain="$(nix build --no-link --print-out-paths .#toolchain)"
          binutils="$(nix build --no-link --print-out-paths .#binutils)"
          compiler="$toolchain/bin/arm-none-eabi-gcc"
          bin="$binutils/bin"
          test -x "$compiler" && test -x "$bin/arm-none-eabi-as"
          printf 'CROSS_COMPILE=%s\n' "${compiler%gcc}" >> "$GITHUB_ENV"
          printf 'ARM_AS=%s\n' "$bin/arm-none-eabi-as" >> "$GITHUB_ENV"
          printf 'ARM_OBJDUMP=%s\n' "$bin/arm-none-eabi-objdump" >> "$GITHUB_ENV"
          printf 'ARM_READELF=%s\n' "$bin/arm-none-eabi-readelf" >> "$GITHUB_ENV"
          printf 'ARM_LD=%s\n' "$bin/arm-none-eabi-ld" >> "$GITHUB_ENV"
          printf 'ARM_NONE_EABI_BIN=%s\n' "$bin" >> "$GITHUB_ENV"
          printf '%s\n' "$bin" "$(dirname "$compiler")" >> "$GITHUB_PATH"

      - name: Build, test, and prepare ByteMatch report
        run: npm run ci

      - name: Upload ByteMatch report
        uses: actions/upload-artifact@v4
        with:
          name: AS_EUR_REV2_report
          path: build/AS_EUR_REV2/report.json
          if-no-files-found: error

