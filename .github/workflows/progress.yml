name: Decompilation progress

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build clean-room base objects
        run: npm run base:build

      - name: Check repository boundary
        run: npm run check

      - name: Prepare validated ByteMatch report
        run: npm run report

      - name: Upload ByteMatch report
        uses: actions/upload-artifact@v4
        with:
          name: AS_EUR_REV2_report
          path: build/AS_EUR_REV2/report.json
          if-no-files-found: error

