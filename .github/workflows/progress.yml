name: Decompilation progress

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check repository boundary
        run: npm run check

      - name: Install pinned reporting tool
        run: npm run tools:install

      - name: Generate genuine objdiff report when enabled
        run: npm run report

      - name: Upload ByteMatch report
        if: ${{ hashFiles('build/AS_EUR_REV2/report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: AS_EUR_REV2_report
          path: build/AS_EUR_REV2/report.json
          if-no-files-found: error

