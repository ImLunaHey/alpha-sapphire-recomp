name: Decompilation progress

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Select pinned ARM toolchain
        shell: bash
        run: |
          toolchain="$(nix build --no-link --print-out-paths nixpkgs#gcc-arm-embedded)"
          compiler="$(find "$toolchain" -type f -name arm-none-eabi-gcc -print -quit)"
          test -x "$compiler"
          printf 'CROSS_COMPILE=%s\n' "${compiler%gcc}" >> "$GITHUB_ENV"

      - name: Build clean-room base objects
        run: npm run base:build

      - name: Check repository boundary
        run: npm run check

      - name: Prepare validated ByteMatch report
        run: npm run report

      - name: Upload ByteMatch report
        uses: actions/upload-artifact@v4
        with:
          name: AS_EUR_REV2_report
          path: build/AS_EUR_REV2/report.json
          if-no-files-found: error

